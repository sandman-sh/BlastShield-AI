  <line x1="23" y1="32" x2="32" y2="38" stroke="#00FF66" stroke-width="2" />
  <line x1="41" y1="32" x2="32" y2="38" stroke="#00FF66" stroke-width="2" />
  <line x1="32" y1="38" x2="32" y2="48" stroke="#00FF66" stroke-width="1.5" stroke-linecap="round" />
